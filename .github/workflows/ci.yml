name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    # A confirmar: assume que a imagem `macos-26` existe e traz Xcode >= 26.
    # O projeto usa Swift 6.4 (Xcode 27). Se o runner trouxer Swift mais antigo,
    # `make cobertura` pode falhar por versão de toolchain; nesse caso, registrar a causa
    # em docs/padroes-stack-swift.md (seção 7) em vez de contornar no código.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Selecionar o Xcode mais novo instalado
        run: |
          set -eu
          # Ordem de versão: o último de `ls -d /Applications/Xcode*.app` (ex.: Xcode_27.app > Xcode_26.app).
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Xcode escolhido: $xcode"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"

      - name: Mostrar versões
        run: |
          xcodebuild -version
          swift --version

      - name: Instalar SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: make lint

      - name: Cobertura do pacote (piso por alvo)
        run: make cobertura

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f build/cobertura/resumo.txt ]; then
            {
              echo '```text'
              cat build/cobertura/resumo.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sem relatório de cobertura." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: cobertura-pacote
          path: build/cobertura/
          if-no-files-found: ignore

      - name: Conferir tokens do design system
        run: make tokens

      - name: Conferir entitlements
        run: make entitlements

  app:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Selecionar o Xcode mais novo instalado
        run: |
          set -eu
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Xcode escolhido: $xcode"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"

      - name: Instalar XcodeGen e xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Gerar o projeto e compilar o app
        # O Makefile exporta CAPTA_LOCAL sozinho; sem project.local.yml, o include é desligado.
        run: make gerar build

      - name: Cobertura do app (piso)
        run: make cobertura-app

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f build/cobertura/resumo-app.txt ]; then
            {
              echo '```text'
              cat build/cobertura/resumo-app.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sem relatório de cobertura." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: cobertura-app
          path: build/cobertura/
          if-no-files-found: ignore

  sonar:
    # Sem segredo em PR de fork: nesse caso o job nem roda.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Selecionar o Xcode mais novo instalado
        run: |
          set -eu
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Xcode escolhido: $xcode"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"

      - name: Instalar SonarScanner, XcodeGen e xcbeautify
        run: brew install sonar-scanner xcodegen xcbeautify

      - name: Gerar a cobertura do pacote
        run: make cobertura

      # O Sonar precisa dos dois relatórios; sem este, `App/Fontes` aparece com 0 %.
      - name: Gerar a cobertura do app
        run: make cobertura-app

      - name: Analisar no SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: sonar-scanner

  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validar mensagens de commit (Conventional Commits)
        env:
          EVENTO: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_ANTES: ${{ github.event.before }}
          PUSH_DEPOIS: ${{ github.sha }}
        run: |
          set -eu
          zero=0000000000000000000000000000000000000000
          if [ "$EVENTO" = pull_request ]; then
            intervalo="$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_ANTES" = "$zero" ] || ! git cat-file -e "$PUSH_ANTES^{commit}" 2>/dev/null; then
            # Primeiro push ou histórico reescrito: valida só o commit publicado.
            intervalo="$PUSH_DEPOIS^!"
          else
            intervalo="$PUSH_ANTES..$PUSH_DEPOIS"
          fi
          echo "Intervalo: $intervalo"
          arquivo=$(mktemp)
          falhas=0
          for sha in $(git rev-list --no-merges "$intervalo"); do
            git log -1 --format=%B "$sha" > "$arquivo"
            if ! sh ferramentas/hooks/commit-msg "$arquivo"; then
              echo "Commit $sha reprovado" >&2
              falhas=$((falhas + 1))
            fi
          done
          [ "$falhas" -eq 0 ]
