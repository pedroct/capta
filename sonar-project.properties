sonar.organization=pedroct
sonar.projectKey=pedroct_capta
sonar.projectName=Capta

sonar.sourceEncoding=UTF-8
sonar.sources=App,Packages/CaptaNucleo/Sources
sonar.tests=Packages/CaptaNucleo/Tests,App/Testes
sonar.exclusions=**/.build/**,build/**,**/*.xcodeproj/**

# Fora da conta de cobertura, como no portão local: a casca fina do sistema fica em
# `ferramentas/cobertura.exclusoes` (exige tela e permissão reais) e `CaptaApp.swift` é só fiação.
sonar.coverage.exclusions=Packages/CaptaNucleo/Sources/CaptaSistema/Casca/**,App/Fontes/CaptaApp.swift

# Gerados por `make cobertura` e `make cobertura-app` (formato genérico do Sonar; caminhos relativos à raiz).
sonar.coverageReportPaths=build/cobertura/sonar-cobertura.xml,build/cobertura/sonar-cobertura-app.xml
