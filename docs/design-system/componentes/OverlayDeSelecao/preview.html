<!-- @dsCard group="Captura" height=300 subtitle="Overlay de seleção de região: mira, máscara, chip de dimensões e ajuda" -->
<style>
  body { margin: 0; padding: var(--espaco-4); background: var(--superficie-janela); color: var(--texto); font-family: var(--font-sans); }
  .tela { position: relative; width: 420px; height: 240px; border-radius: var(--raio-cartao); overflow: hidden; background: linear-gradient(135deg, var(--marca-ardosia), var(--marca-verde-agua)); }
  .mira-h { position: absolute; left: 0; right: 0; top: 110px; height: 1px; background: rgba(255,255,255,.7); }
  .mira-v { position: absolute; top: 0; bottom: 0; left: 190px; width: 1px; background: rgba(255,255,255,.7); }
  .sel { position: absolute; left: 90px; top: 60px; width: 200px; height: 100px; border: 2px dashed var(--destaque); box-shadow: 0 0 0 9999px rgba(0,0,0,var(--opacidade-mascara)); background: rgba(255,255,255,.08); }
  .chip { position: absolute; left: 90px; top: 168px; padding: 2px var(--espaco-3); border-radius: var(--raio-chip); background: var(--superficie-janela); border: 1px solid var(--borda); font: 400 12px/16px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--texto); }
  .ajuda { position: absolute; left: var(--espaco-2); bottom: var(--espaco-2); padding: var(--espaco-2) var(--espaco-3); border-radius: var(--raio-cartao); background: var(--superficie-janela); border: 1px solid var(--borda); font: 400 11px/16px var(--font-sans); color: var(--texto-secundario); }
  .ajuda b { color: var(--texto); font-weight: 600; }
</style>
<div class="tela" role="img" aria-label="Exemplo de overlay de seleção com região de 640 por 360">
  <div class="mira-h"></div><div class="mira-v"></div>
  <div class="sel"></div>
  <div class="chip">640 × 360</div>
  <div class="ajuda"><b>Esc</b> cancelar · <b>F</b> tela inteira · <b>M</b> lupa<br><b>Espaço</b> região/janela · <b>H</b> ajuda</div>
</div>
